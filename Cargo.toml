[package]
name = "veyva"
version = "0.1.0"
edition = "2021"
publish = false
description = "A lightweight Windows replay recorder"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
windows = { version = "=0.58.0", features = [
 "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
 "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation",
 "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
 "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_System_Performance", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"
] }
